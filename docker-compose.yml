services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512m}
          cpus: "1"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:5000,localhost:*,127.0.0.1:*"
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination /mlartifacts
      --serve-artifacts
    volumes:
      - ${MLFLOW_ARTIFACTS_DIR:-./mlartifacts}:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5002}:5000"   # UI and API reachable from this machine only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MLFLOW_MEMORY_LIMIT:-2g}
          cpus: "1"

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # from .env; empty = /reload disabled
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          # Sized for the serving model chosen by `nyc-taxi select`; raise it in .env to serve a larger one
          memory: ${API_MEMORY_LIMIT:-2g}
          cpus: "${API_CPU_LIMIT:-2}"

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - api
    ports:
      - "127.0.0.1:9090:9090"   # web UI from this machine only
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512m}
          cpus: "0.5"

volumes:
  pgdata:
  promdata:
