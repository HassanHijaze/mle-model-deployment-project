[project]
name = "mle-model-deployment-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "geopandas>=1.2.0",
    "holidays>=0.108",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "prometheus-client>=0.26.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# One-command pipeline: uv run nyc-taxi all  (see src/cli.py)
nyc-taxi = "src.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package is "src" (imports stay `from src...`, `python -m src.train` still works)
packages = ["src"]

[dependency-groups]
dev = [
    "geopandas>=1.2.0",
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "locust>=2.47.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "nbformat>=5.11.1",
    "optuna>=5.1.0",
    "pip>=26.3",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# End-to-end tests start docker compose; run them explicitly with `uv run pytest -m e2e`
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end test against a docker compose stack (postgres, mlflow, api)"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "app"]
ignore_missing_imports = true   # pandas, scikit-learn, mlflow, ... ship no type information
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.uv]
required-version = ">=0.9"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
