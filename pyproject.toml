[project]
name = "mle-model-deployment-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "geopandas>=1.2.0",
    "holidays>=0.108",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "geopandas>=1.2.0",
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "optuna>=5.1.0",
    "pip>=26.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.9"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
