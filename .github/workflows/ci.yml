# Runs on every push and pull request:
#   - tests: unit and data tests (model/API tests skip themselves, since CI has no MLflow server)
#   - docker: checks that the API image still builds
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # No MLflow server in CI: fail fast instead of retrying, so those tests skip quickly
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t nyc-taxi-api .
